# nginx config for the built SPA. It has two jobs:
#   1. serve the static bundle, with a fallback so client-side routes work;
#   2. reverse-proxy the backend's API paths, so the browser makes same-origin
#      requests and no CORS handling is needed (the Go backend has none).
#
# This replaces the `server.proxy` block in vite.config.ts, which applies ONLY
# to the vite dev server and is absent from a production build.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Set once at server level; inherited by every proxy_pass below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------------------------------------------------------------
    # /signup is BOTH a client-side route (the signup page) and a POST-only
    # backend endpoint. A browser navigation (GET) must render the SPA; only a
    # POST may reach the backend. This mirrors the method-aware `bypass` in
    # vite.config.ts — that one is load-bearing, and so is this one: without it
    # loading the signup page returns 405 from the POST-only Go handler.
    #
    # `if` is used only to `return`, never to wrap proxy_pass alongside
    # try_files (which is the unsafe pattern). The POST case exits via an
    # internal error_page jump to a named location instead.
    # ---------------------------------------------------------------------
    location = /signup {
        recursive_error_pages on;
        error_page 418 = @signup_api;
        if ($request_method = POST) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @signup_api {
        # No URI part: nginx forbids one inside a named location, and none is
        # needed — the original request URI (/signup) is passed through as-is.
        proxy_pass http://backend;
    }

    # --- Plain API endpoints (exact matches) ---
    location = /signin  { proxy_pass http://backend; }
    location = /refresh { proxy_pass http://backend; }
    location = /test    { proxy_pass http://backend; }

    # Prefix match: covers both /instances and /instances/{id}.
    location /instances { proxy_pass http://backend; }

    # --- SPA fallback for /login, /dashboard, etc. ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
